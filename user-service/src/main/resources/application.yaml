server:
  port: 8080

spring:
  # Configuración de base de datos (H2 para desarrollo)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Habilitar consola H2
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuración de JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Configuración personalizada del sistema
api:
  users:
    url: https://jsonplaceholder.typicode.com
  security:
    jwt:
      # IMPORTANTE: Cambiar en producción por una clave más robusta
      secret: "NDAyRTYzNTI2NjU1NkE1ODZFMzI3MjM1NzU4Nzg0RjQxM0Y0NDI4NDcyQjRLNjI1MDY1NTM2ODU2NkQ1OTcx"

# Configuración de Actuator (Punto d)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Configuración de Logs (SLF4J)
logging:
  level:
    root: INFO
    com.backend.userservice: DEBUG
    org.springframework.security: INFO
    org.springframework.web: WARN